<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados y Estadísticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Librería Chart.js para la gráfica -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- MENÚ -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold salvia" href="/">🌿 Espacio Emocional</a>
            <div class="navbar-nav ms-auto flex-row gap-3 align-items-center">
                <a class="nav-link fw-bold" href="/">Inicio</a>
                <a class="nav-link fw-bold salvia" href="/resultados.html">Resultados</a>
                <a class="btn btn-salvia rounded-pill px-4" href="/formulario.html">Encuesta</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold salvia">Resultados de los Estudiantes</h2>
            <p class="text-muted">Estadísticas en tiempo real guardadas en MongoDB</p>
        </div>

        <div class="row g-4 mb-5">
            <!-- GRÁFICA DE BARRAS -->
            <div class="col-md-7">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                    <h5 class="fw-bold salvia mb-3">Gráfica de Emociones</h5>
                    <canvas id="grafica"></canvas>
                </div>
            </div>

            <!-- TABLA DE PORCENTAJES -->
            <div class="col-md-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                    <h5 class="fw-bold salvia mb-3">Tabla de Porcentajes</h5>
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Emoción</th>
                                <th>Cantidad</th>
                                <th>Porcentaje</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPorcentajes"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TABLA DE REGISTROS INDIVIDUALES -->
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold salvia mb-3">Historial de Respuestas</h5>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Estudiante</th>
                            <th>Edad</th>
                            <th>Emoción detectada</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAlumnos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function cargarDatos() {
            const res = await fetch("/datos");
            const datos = await res.json();
            const total = datos.length;

            // Contar cuántas veces aparece cada emoción
            const conteo = {};
            const tablaAlumnos = document.getElementById("tablaAlumnos");

            datos.reverse().forEach(fila => {
                conteo[fila.emocion] = (conteo[fila.emocion] || 0) + 1;

                tablaAlumnos.innerHTML += `
                    <tr>
                        <td class="fw-semibold">${fila.nombre}</td>
                        <td>${fila.edad} años</td>
                        <td>
                            <img src="/css/img/${fila.emocion}.png" style="width:28px; height:28px;" class="me-2">
                            <span class="text-capitalize fw-bold">${fila.emocion}</span>
                        </td>
                        <td class="text-muted small">${fila.fecha || "Reciente"}</td>
                    </tr>`;
            });

            // Llenar tabla de porcentajes y preparar datos para la gráfica
            const etiquetas = Object.keys(conteo);
            const cantidades = Object.values(conteo);
            const tablaPorcentajes = document.getElementById("tablaPorcentajes");

            etiquetas.forEach(emo => {
                const cant = conteo[emo];
                const porc = total > 0 ? ((cant / total) * 100).toFixed(1) : 0;

                tablaPorcentajes.innerHTML += `
                    <tr>
                        <td class="text-capitalize fw-bold">
                            <img src="/css/img/${emo}.png" style="width:24px; height:24px;" class="me-1"> ${emo}
                        </td>
                        <td>${cant}</td>
                        <td><span class="badge bg-success-subtle text-success">${porc}%</span></td>
                    </tr>`;
            });

            // Dibujar gráfica con Chart.js
            new Chart(document.getElementById("grafica"), {
                type: "bar",
                data: {
                    labels: etiquetas.map(e => e.toUpperCase()),
                    datasets: [{
                        label: "Cantidad de estudiantes",
                        data: cantidades,
                        backgroundColor: "#5c8374",
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        cargarDatos();
    </script>
</body>
</html>
