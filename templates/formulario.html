<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Emocional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- MENÚ -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold salvia" href="/">🌿 Espacio Emocional</a>
            <div class="navbar-nav ms-auto flex-row gap-3 align-items-center">
                <a class="nav-link fw-bold" href="/">Inicio</a>
                <a class="nav-link fw-bold" href="/resultados.html">Resultados</a>
                <a class="btn btn-salvia rounded-pill px-4" href="/formulario.html">Encuesta</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="card border-0 shadow-sm rounded-4 mx-auto p-4 p-md-5" style="max-width: 650px;">
            
            <!-- IMAGEN AL INICIO DEL FORMULARIO -->
            <div class="text-center border-bottom pb-3 mb-4">
                <img src="/css/img/Emociones2.jpeg" alt="Emociones" class="img-fluid rounded-4 mb-2" style="max-width: 260px;">
                <h3 class="fw-bold salvia">¿Cómo te sientes hoy?</h3>
                <span class="badge bg-success-subtle text-success rounded-pill">Para estudiantes de 15 a 18 años</span>
            </div>

            <!-- ALERTA DE VALIDACIÓN -->
            <div id="errorBox" class="alert alert-danger d-none small"></div>

            <!-- FORMULARIO CON 6 PREGUNTAS -->
            <form id="form" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre completo</label>
                    <input type="text" id="nombre" class="form-control rounded-3" placeholder="Escribe tu nombre y apellidos" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Edad (15 a 18 años)</label>
                    <select id="edad" class="form-select rounded-3" required>
                        <option value="">Selecciona tu edad...</option>
                        <option value="15">15 años</option>
                        <option value="16">16 años</option>
                        <option value="17">17 años</option>
                        <option value="18">18 años</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">1. ¿Cómo sientes tu cuerpo y tu energía hoy?</label>
                    <select id="p1" class="form-select rounded-3" required>
                        <option value="">Elige una opción...</option>
                        <option value="feliz">Con buen ánimo y tranquilo</option>
                        <option value="emocionado">Con mucha energía y ganas de hacer cosas</option>
                        <option value="cansado">Con sueño, pesado o agotado</option>
                        <option value="enfermo">Con malestar físico o débil</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">2. ¿Qué ocupa más tu mente en este momento?</label>
                    <select id="p2" class="form-select rounded-3" required>
                        <option value="">Elige una opción...</option>
                        <option value="feliz">Recuerdos o cosas buenas que me hacen sonreír</option>
                        <option value="preocupado">Pendientes, tareas o problemas por resolver</option>
                        <option value="nervioso">Algo importante que va a pasar pronto</option>
                        <option value="aburrido">Nada en especial, siento mucha rutina</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">3. ¿Cómo te sientes al convivir con tus amigos o familia hoy?</label>
                    <select id="p3" class="form-select rounded-3" required>
                        <option value="">Elige una opción...</option>
                        <option value="feliz">A gusto, conectado y en confianza</option>
                        <option value="travieso">Con ganas de bromear, reír y hacer ocurrencias</option>
                        <option value="avergonzado">Incómodo o con pena por algo que dije o hice</option>
                        <option value="triste">Con ganas de estar solo o algo sensible</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">4. ¿Cómo reaccionas ahorita si algo no sale como esperabas?</label>
                    <select id="p4" class="form-select rounded-3" required>
                        <option value="">Elige una opción...</option>
                        <option value="feliz">Lo tomo con calma y busco solución</option>
                        <option value="enojado">Me irrito rápido o me da coraje</option>
                        <option value="asustado">Me bloqueo o siento temor</option>
                        <option value="preocupado">Me quedo dándole muchas vueltas al asunto</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">5. ¿Cómo ves tu día escolar o tus actividades de hoy?</label>
                    <select id="p5" class="form-select rounded-3" required>
                        <option value="">Elige una opción...</option>
                        <option value="emocionado">Interesante, tengo ganas de lo que sigue</option>
                        <option value="aburrido">Lento, sin chiste o sin motivación</option>
                        <option value="nervioso">Con presión o tensión por exámenes/entregas</option>
                        <option value="cansado">Pesado, solo quiero que acabe para dormir</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">6. Si pudieras elegir algo ahora mismo, ¿qué harías?</label>
                    <select id="p6" class="form-select rounded-3" required>
                        <option value="">Elige una opción...</option>
                        <option value="travieso">Salir a divertirme y hacer algo espontáneo</option>
                        <option value="cansado">Acostarme a descansar sin ver el celular</option>
                        <option value="triste">Escuchar música tranquila y desahogarme</option>
                        <option value="asustado">Estar en un lugar seguro donde nada me presione</option>
                        <option value="enojado">Despejarme solo para bajar el coraje</option>
                        <option value="avergonzado">Desaparecer un ratito para pasar la pena</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-salvia w-100 py-2 rounded-pill fw-bold">Enviar y ver emoción</button>
            </form>

            <!-- RESULTADO -->
            <div id="resultado" class="d-none text-center bg-light rounded-4 p-4">
                <h4 id="saludo" class="fw-bold salvia"></h4>
                <p>Tu emoción actual es:</p>
                <img id="foto" src="" class="my-2" style="width: 130px; height: 130px; object-fit: contain;">
                <h2 id="texto" class="fw-bold text-uppercase"></h2>
                <div id="aviso" class="alert alert-success mt-3 mb-3 small">Guardado en la base de datos ✓</div>
                <a href="/resultados.html" class="btn btn-salvia rounded-pill px-4">Ver gráfica y resultados generales</a>
            </div>

        </div>
    </main>

    <script>
        document.getElementById("form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const edad = document.getElementById("edad").value;
            const resp = [
                document.getElementById("p1").value,
                document.getElementById("p2").value,
                document.getElementById("p3").value,
                document.getElementById("p4").value,
                document.getElementById("p5").value,
                document.getElementById("p6").value
            ];

            // VALIDACIÓN CON JAVASCRIPT
            const errorBox = document.getElementById("errorBox");
            const soloLetras = /^[a-zA-ZÁÉÍÓÚáéíóúñÑ\s]+$/;

            if (nombre.length < 3 || !soloLetras.test(nombre)) {
                errorBox.textContent = "Por favor escribe un nombre válido (solo letras, mínimo 3 caracteres).";
                errorBox.classList.remove("d-none");
                return;
            }
            if (!edad || resp.includes("")) {
                errorBox.textContent = "Por favor selecciona tu edad y responde todas las preguntas.";
                errorBox.classList.remove("d-none");
                return;
            }
            errorBox.classList.add("d-none");

            // Calcular emoción más frecuente
            const conteo = {};
            let emocion = resp[0];
            let max = 0;

            resp.forEach(item => {
                conteo[item] = (conteo[item] || 0) + 1;
                if (conteo[item] > max) {
                    max = conteo[item];
                    emocion = item;
                }
            });

            // Mostrar resultado
            document.getElementById("form").classList.add("d-none");
            document.getElementById("resultado").classList.remove("d-none");
            document.getElementById("saludo").textContent = "Hola, " + nombre;
            document.getElementById("texto").textContent = emocion;
            document.getElementById("foto").src = "/css/img/" + emocion + ".png";

            // Guardar en MongoDB
            await fetch("/guardar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre, edad, respuestas: resp, emocion })
            });
        });
    </script>
</body>
</html>
